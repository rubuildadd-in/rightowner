<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RightOwner</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="styles.css?v=1.0.1">
  <script src="config.js?v=1.0.1"></script>
  <script src="lib/MicrosoftTeams.min.js"></script>
  <script src="lib/msal-browser.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="logo.png" alt="" width="36" height="36">
      <div>
        <h1>RightOwner</h1>
        <p class="tagline">Who owns what in your company</p>
      </div>
    </div>
    <div class="top-actions" id="topActions" hidden>
      <button class="btn primary" id="addBtn" type="button">+ Add item</button>
      <div class="menu-wrap">
        <button class="btn" id="moreBtn" type="button" aria-haspopup="true" aria-expanded="false">More ▾</button>
        <div class="menu" id="moreMenu" hidden>
          <button type="button" id="importBtn">Import from CSV</button>
          <button type="button" id="templateBtn">Download CSV template</button>
          <button type="button" id="exportBtn">Export to CSV</button>
          <button type="button" id="historyBtn">Activity history</button>
          <button type="button" id="refreshBtn">Refresh</button>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="state" id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading your directory…</p>
    </section>

    <section class="state" id="message" hidden>
      <h2 id="msgTitle"></h2>
      <p id="msgBody"></p>
      <div class="state-actions" id="msgActions"></div>
    </section>

    <section id="directory" hidden>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search: payroll, VPN, vendor contracts, a person's name…" autocomplete="off" aria-label="Search the directory">
        <div class="chips" role="tablist" aria-label="Filter">
          <button class="chip active" data-filter="all" role="tab" aria-selected="true">All <span id="countAll">0</span></button>
          <button class="chip" data-filter="attention" role="tab" aria-selected="false">Needs a new owner <span id="countAttention">0</span></button>
        </div>
      </div>
      <div id="cards" class="cards" aria-live="polite"></div>
      <div class="empty" id="empty" hidden>
        <h2 id="emptyTitle">No items yet</h2>
        <p id="emptyBody">Add your first item, or import a spreadsheet of owners.</p>
      </div>
    </section>
  </main>

  <footer class="foot">
    <a href="https://rubuild.com/support" target="_blank" rel="noopener">Help</a> ·
    <a href="https://rubuild.com/privacy" target="_blank" rel="noopener">Privacy</a> ·
    <a href="https://rubuild.com/terms" target="_blank" rel="noopener">Terms</a> ·
    <span id="ver"></span>
  </footer>

  <dialog id="itemDialog" aria-labelledby="dlgTitle">
    <form id="itemForm" method="dialog">
      <h2 id="dlgTitle">Add to the directory</h2>
      <label><span>What do people ask about? <span class="req">*</span></span>
        <input name="Title" required maxlength="255" placeholder="A system, task, vendor or budget, e.g. Payroll, VPN access">
      </label>
      <label><span>Team or area <span style="font-weight:400;color:var(--muted)">(optional)</span></span>
        <input name="Category" maxlength="100" list="categoryList" placeholder="e.g. Finance, IT, HR, Facilities">
        <datalist id="categoryList"></datalist>
      </label>
      <label><span>When should people contact the owner? <span style="font-weight:400;color:var(--muted)">(optional)</span></span>
        <textarea name="Description" rows="3" maxlength="2000" placeholder="e.g. Salary changes, payslip questions, new joiner setup"></textarea>
      </label>
      <div class="person-field" data-role="Owner">
        <label><span>Owner: the main person to ask <span class="req">*</span></span>
          <input class="person-input" placeholder="Type a colleague's name or email" autocomplete="off">
        </label>
        <ul class="suggest" hidden></ul>
      </div>
      <div class="person-field" data-role="Backup">
        <label><span>Backup: who to ask when the owner is away <span style="font-weight:400;color:var(--muted)">(optional)</span></span>
          <input class="person-input" placeholder="Type a colleague's name or email" autocomplete="off">
        </label>
        <ul class="suggest" hidden></ul>
      </div>
      <p class="form-error" id="formError" hidden></p>
      <div class="dlg-actions">
        <button type="button" class="btn danger" id="deleteBtn" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Save</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js?v=1.0.1-5"></script>
</body>
</html>
